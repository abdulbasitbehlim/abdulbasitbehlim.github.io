<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
<title id="title">Stylized 3D protein ribbon</title><desc id="desc">Original abstract ribbon-like protein structure rendered with luminous molecular gradients.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#11345a" stop-opacity=".28"/><stop offset="1" stop-color="#07101f" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#4da3ff"/><stop offset="1" stop-color="#6ee7f9"/></linearGradient>
  <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#c084fc"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="700" height="700" fill="url(#bg)"/>
