  <path d="M235 168 C303 111 393 139 404 214 C414 285 332 308 335 370 C338 429 414 459 465 420 C521 376 494 291 429 279 C366 267 322 332 261 321 C190 307 164 222 235 168Z" fill="none" stroke="url(#g2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <path d="M238 469 C291 547 406 570 468 500" fill="none" stroke="url(#g1)" stroke-width="22" stroke-linecap="round"/>
  <path d="M183 276 C238 236 282 239 331 273" fill="none" stroke="#d7f4ff" stroke-width="7" stroke-linecap="round" opacity=".72"/>
  <g fill="#9be7ff" filter="url(#glow)">
    <circle cx="164" cy="354" r="9"/><circle cx="269" cy="207" r="7"/><circle cx="319" cy="336" r="8"/><circle cx="433" cy="341" r="9"/><circle cx="570" cy="426" r="8"/>
