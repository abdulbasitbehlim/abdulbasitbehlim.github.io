<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
<title id="title">Stylized 3D bacteriophage</title><desc id="desc">Original futuristic bacteriophage illustration with faceted capsid, tail sheath, baseplate and tail fibres.</desc>
<defs>
